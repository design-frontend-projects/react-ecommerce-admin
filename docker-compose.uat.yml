name: ecommerce-restaurant-uat
services:
  app:
    build:
      context: .
      target: runner
    restart: always
    env_file:
      - .env.uat
      - .env
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5190/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  lb:
    image: nginx:alpine
    restart: always
    ports:
      - "4011:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
