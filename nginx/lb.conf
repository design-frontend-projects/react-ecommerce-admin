# Use Docker's internal DNS resolver to dynamically discover scaled app containers
resolver 127.0.0.11 valid=10s;

upstream app_servers {
    # 'app' is the Docker Compose service name, and 5190 is the exposed port
    # least_conn ensures requests go to the instance with fewest active connections
    least_conn;
    server app:5190 resolve;
}

server {
    listen 80;
    server_name _;

    # Rate limiting configuration (requires limit_req_zone in nginx.conf)
    limit_req zone=one burst=20 nodelay;

    # Healthcheck endpoint for Nginx itself
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # Cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        proxy_pass http://app_servers;
        proxy_set_header Host $host;
        expires 1M;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://app_servers;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket / SSE Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
